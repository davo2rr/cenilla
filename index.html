<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUE PASA MITOCONDRIA</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;color:#222;margin:0;padding:25px 12px}
.caja{max-width:480px;margin:35px auto;padding:25px;background:white;border:1px solid #ddd;border-radius:8px}
h1{text-align:center;font-size:27px}.centro{text-align:center}.pasos{text-align:center;color:#888;font-size:13px;margin-bottom:25px}
.pagina{display:none}.pagina.activa{display:block}label.titulo{display:block;margin:18px 0 7px;font-weight:bold}
input[type=date],input[type=time],textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #bbb;border-radius:4px;font:inherit;background:white}
textarea{min-height:95px;resize:vertical}.opciones{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opcion input{display:none}.opcion span{display:block;padding:15px 8px;border:1px solid #ccc;border-radius:5px;text-align:center;cursor:pointer;background:#fafafa}
.opcion input:checked+span{background:#ffe5eb;border:2px solid #e58a9e;padding:14px 7px}
button{padding:11px 17px;border:1px solid #aaa;border-radius:5px;background:#eee;font-size:15px;cursor:pointer}
button:hover{background:#e2e2e2}.principal{background:#f5cbd5;border-color:#df9eae}.principal:hover{background:#efb9c7}
button:disabled{opacity:.65;cursor:wait}.botones{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.botones button:only-child{margin-left:auto}
.error{color:#b00020;font-size:14px;min-height:18px}.resumen{background:#fafafa;border:1px solid #ddd;padding:15px;border-radius:5px;line-height:1.8}
.nota{color:#777;font-size:12px;text-align:center;margin-top:20px}@media(max-width:350px){.opciones{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="caja">
<div class="pasos" id="pasos">PASO 1 DE 3</div>
<section class="pagina activa" id="pagina1">
<h1>QUE PASA MITOCONDRIA</h1><p class="centro">va hermonita que me ha tomao mi tiempo hacer esto</p>
<label class="titulo" for="fecha">klk que dia:</label><input type="date" id="fecha" required>
<label class="titulo" for="hora">y la hora ma o menos</label><input type="time" id="hora" required>
<p class="error" id="error1"></p><div class="botones"><button class="principal" id="siguiente1">SIGUIENTE PAGINA PAPI</button></div>
</section>
<section class="pagina" id="pagina2">
<h1>que te apetece miloba</h1><p>elige</p>
<div class="opciones">
<label class="opcion"><input type="radio" name="comida" value="JAMBURGER"><span>🍔 JAMBURGER</span></label>
<label class="opcion"><input type="radio" name="comida" value="SUSI"><span>🍣 SUSI</span></label>
<label class="opcion"><input type="radio" name="comida" value="PIZZA"><span>🍕 PIZZA</span></label>
<label class="opcion"><input type="radio" name="comida" value="PANCHITOTACOS"><span>🌮 PANCHITOTACOS</span></label>
<label class="opcion"><input type="radio" name="comida" value="PASTA BUEN ROLLO"><span>🍝 PASTA BUEN ROLLO</span></label>
<label class="opcion"><input type="radio" name="comida" value="sorpresa, ten cuidao"><span>🦓 sorpresa, ten cuidao</span></label>
</div>
<p class="error" id="error2"></p><div class="botones"><button id="atras2">Atrás</button><button class="principal" id="siguiente2">SIGUIENTE, QUEDA YA POCO PAPI</button></div>
</section>
<section class="pagina" id="pagina3">
<h1>Última cosilla</h1><p>escribeme que te ha parecido, es lo mas friki q he hecho en mi vida (opcional)</p>
<textarea id="comentario" placeholder="frikada historica"></textarea>
<p class="error" id="error3" aria-live="polite"></p>
<div class="botones"><button id="atras3">Atrás</button><button class="principal" id="finalizar">ENVIAR AL TETE QUE TE TIRA POR IG</button></div>
</section>
<section class="pagina" id="paginaFinal">
<h1>VENGA PRIMA</h1><p class="centro">Respuesta enviada. </p>
<div class="resumen" id="resumen"></div><p class="nota">un saludico paya</p>
</section>
</main>
<script>
const fecha=document.getElementById("fecha");
const ahora=new Date(),fechaLocal=new Date(ahora.getTime()-ahora.getTimezoneOffset()*60000).toISOString().slice(0,10);
fecha.min=fechaLocal;
function mostrar(n){
 document.querySelectorAll(".pagina").forEach(p=>p.classList.remove("activa"));
 document.getElementById(n===4?"paginaFinal":"pagina"+n).classList.add("activa");
 const pasos=document.getElementById("pasos");pasos.textContent=n===4?"TERMINADO":"PASO "+n+" DE 3";pasos.style.display=n===4?"none":"block";
}
document.getElementById("siguiente1").onclick=()=>{
 const hora=document.getElementById("hora").value,e=document.getElementById("error1");
 if(!fecha.value||!hora){e.textContent="Tienes que elegir fecha y hora.";return}
 if(fecha.value<fechaLocal){e.textContent="Esa fecha ya ha pasado.";return}
 e.textContent="";mostrar(2);
};
document.getElementById("siguiente2").onclick=()=>{
 if(!document.querySelector('input[name="comida"]:checked')){document.getElementById("error2").textContent="Elige algo anda 😅";return}
 document.getElementById("error2").textContent="";mostrar(3);
};
document.getElementById("atras2").onclick=()=>mostrar(1);
document.getElementById("atras3").onclick=()=>mostrar(2);
document.getElementById("finalizar").onclick=async()=>{
 const boton=document.getElementById("finalizar"),error=document.getElementById("error3");
 const comida=document.querySelector('input[name="comida"]:checked').value;
 const comentario=document.getElementById("comentario").value.trim();
 const partes=fecha.value.split("-");
 const fechaBonita=new Date(+partes[0],+partes[1]-1,+partes[2]).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"});
 const hora=document.getElementById("hora").value;
 boton.disabled=true;boton.textContent="Enviando...";error.textContent="";
 const datos={
  access_key:"7affcc5c-9631-402a-9a4e-d361212edc96",
  subject:"¡Han respondido a la invitación para cenar! ❤️",
  from_name:"Invitación para cenar",
  Fecha:fechaBonita,Hora:hora,Cena:comida,Comentario:comentario||"Sin comentario"
 };
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
 try{
  const respuesta=await fetch("https://api.web3forms.com/submit",{
   method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
   body:JSON.stringify(datos),signal:controller.signal
  });
  const resultado=await respuesta.json();
  if(!respuesta.ok||resultado.success!==true)throw new Error(resultado.message||resultado.error||"El servicio no ha aceptado el envío.");
  document.getElementById("resumen").innerHTML="<b>Fecha:</b> "+escapar(fechaBonita)+"<br><b>Hora:</b> "+escapar(hora)+"<br><b>Cena:</b> "+escapar(comida)+"<br><b>Comentario:</b> "+escapar(comentario||"Ninguno");
  mostrar(4);
 }catch(err){
  error.textContent=err.name==="AbortError"?"El envío está tardando demasiado. Prueba otra vez.":err.message;
  boton.disabled=false;boton.textContent="Reintentar envío";
 }finally{clearTimeout(timeout)}
};
function escapar(t){return t.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script>
</body>
</html>
